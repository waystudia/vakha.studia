<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vakha Studio</title>
    <script>
      (function (location) {
        var pathSegmentsToKeep = 1;
        var base = location.pathname.split("/").slice(0, pathSegmentsToKeep + 1).join("/");
        var route = location.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/");
        var query = location.search ? "&" + location.search.slice(1).replace(/&/g, "~and~") : "";
        location.replace(location.origin + base + "/?/" + route + query + location.hash);
      })(window.location);
    </script>
  </head>
  <body style="font-family:system-ui,sans-serif;background:#f5f7fb;color:#17243b;padding:32px;line-height:1.6">
    <h1>Открываем страницу класса…</h1>
    <p>Если переход задерживается, проверьте интернет. Попробуйте включить VPN; если он уже включён — выключите и включите снова.</p>
    <p><a id="retry" href="./">Повторить переход</a></p>
    <script>
      document.getElementById('retry').href = location.origin + location.pathname.split('/').slice(0,2).join('/') + '/?/' + location.pathname.split('/').slice(2).join('/') + (location.search ? '&' + location.search.slice(1).replace(/&/g,'~and~') : '') + location.hash;
    </script>
  </body>
</html>
