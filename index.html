<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7fb" />
    <meta name="description" content="Vakha Studio — заявки родителей на школьную фотосессию" />
    <title>Vakha Studio — школьные фотозаказы</title>
    <script>
      (function (location) {
        if (location.search.slice(0, 2) !== "?/") return;
        var restored = location.search
          .slice(2)
          .split("&")
          .map(function (part) { return part.replace(/~and~/g, "&"); })
          .join("?");
        window.history.replaceState(null, "", location.pathname + restored + location.hash);
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
